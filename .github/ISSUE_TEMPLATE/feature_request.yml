name: Propor melhoria
description: Discuta uma melhoria com objetivo, escopo e aceite.
title: '[Melhoria] '
body:
- type: markdown
  attributes:
    value: Obrigado por ajudar o OLYMPUS. Não envie chaves, senhas ou dados pessoais. Para vulnerabilidades,
      siga SECURITY.md.
- type: textarea
  id: problem
  attributes:
    label: Problema ou necessidade
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposta e escopo
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Como verificar a melhoria
    description: Critérios objetivos e exemplo de uso.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternativas e impactos
    description: Custos, dependências, migrações ou dados afetados, se houver.
  validations:
    required: false
