name: OLYMPUS private cloud containers
on:
  push:
    branches: [feature/olympus-cloud-private-beta]
    paths:
      - .dockerignore
      - frontend/**
      - backend/**
      - olympus/**
      - vendor/**
      - .github/workflows/cloud-container-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-same-origin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend from repository root
        run: |
          docker build --pull -f backend/Dockerfile -t olympus-beta-backend:ci .
          docker build --pull -f frontend/Dockerfile -t olympus-beta-frontend:ci .
      - name: Start one isolated backend and same-origin frontend
        run: |
          set -euo pipefail
          docker network create olympus-beta-ci
          ADMIN_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 48)"
          docker run -d --name olympus-ci-backend --network olympus-beta-ci \
            --network-alias olympus-cloud-backend.railway.internal \
            -e OLYMPUS_ENV=staging \
            -e OLYMPUS_CLOUD_DATA_DIR=/data \
            -e OLYMPUS_CLOUD_WORKERS=1 \
            -e OLYMPUS_ENABLE_LEGACY_API=0 \
            -e OLYMPUS_ADMIN_EMAIL=ci-admin@example.invalid \
            -e "OLYMPUS_ADMIN_SENHA=$ADMIN_PASSWORD" \
            -e "OLYMPUS_JWT_SECRET=$JWT_SECRET" \
            olympus-beta-backend:ci
          docker run -d --name olympus-ci-frontend --network olympus-beta-ci \
            -p 127.0.0.1:18080:3000 olympus-beta-frontend:ci
          READY=0
          for i in $(seq 1 35); do
            FRONT=$(curl --max-time 4 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/login || true)
            PROXY=$(curl --max-time 4 -sS -o /tmp/olympus-health.json -w '%{http_code}' http://127.0.0.1:18080/api/olympus/health || true)
            if [ "$FRONT" = 200 ] && [ "$PROXY" = 200 ]; then READY=1; break; fi
            if [ "$i" -eq 1 ] || [ "$i" -eq 10 ] || [ "$i" -eq 25 ]; then
              echo "SMOKE_WAIT frontend=$FRONT backend_via_proxy=$PROXY"
            fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            echo "SMOKE_FAILED frontend=$FRONT proxy=$PROXY"
            echo "Backend process state:"
            docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' olympus-ci-backend || true
            echo "Frontend process state:"
            docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' olympus-ci-frontend || true
            echo "Direct internal backend fetch:"
            docker exec olympus-ci-frontend node -e "fetch('http://olympus-cloud-backend.railway.internal:8000/health').then(r=>console.log('backend_internal_http',r.status)).catch(e=>console.log('backend_internal_failure',e.name,e.message))" || true
            echo "Last backend and frontend logs:"
            docker logs olympus-ci-backend 2>&1 | tail -n 60 || true
            docker logs olympus-ci-frontend 2>&1 | tail -n 60 || true
            exit 1
          fi
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          with open('/tmp/olympus-health.json', encoding='utf-8') as f:
              info=json.load(f)
          assert info['status']=='ok',info
          assert 'version' in info
          url='http://127.0.0.1:18080/api/olympus/cloud/missions'
          request=urllib.request.Request(url, data=b'{}',
                   headers={'Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(request,timeout=8)
          except urllib.error.HTTPError as error:
              assert error.code in (401,403),f'unauthorized mission returned {error.code}'
          else:
              raise AssertionError('Unauthenticated mission request was accepted')
          print('CLOUD_SMOKE_OK: frontend login + same-origin backend health + mission authorization')
          PY
      - name: Validate staging fails closed without JWT secret
        run: |
          if docker run --rm -e OLYMPUS_ENV=staging olympus-beta-backend:ci \
             python -c 'from app.main import app' ; then
            echo 'UNSAFE: staging started without JWT secret'; exit 1
          fi
          echo 'Staging JWT startup guard rejects missing secret'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs olympus-ci-backend 2>/dev/null | tail -n 50 || true
          docker logs olympus-ci-frontend 2>/dev/null | tail -n 50 || true
          docker rm -f olympus-ci-frontend olympus-ci-backend 2>/dev/null || true
          docker network rm olympus-beta-ci 2>/dev/null || true
