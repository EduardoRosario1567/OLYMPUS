name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt pytest

      - name: Preparar configuração efêmera da CI
        run: |
          cp backend/.env.example backend/.env
          python3 - <<'PY'
          import os, secrets
          admin_email = "ci-admin@example.invalid"
          admin_password = secrets.token_urlsafe(36)
          jwt_secret = secrets.token_hex(48)
          print("::add-mask::" + admin_password)
          print("::add-mask::" + jwt_secret)
          with open("backend/.env", "a", encoding="utf-8") as f:
              f.write("\nOLYMPUS_ADMIN_EMAIL=" + admin_email + "\n")
              f.write("OLYMPUS_ADMIN_SENHA=" + admin_password + "\n")
              f.write("OLYMPUS_JWT_SECRET=" + jwt_secret + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("CI_ADMIN_EMAIL=" + admin_email + "\n")
              f.write("CI_ADMIN_PASSWORD=" + admin_password + "\n")
          print("Ephemeral admin credentials generated; no secret output.")
          PY

      - name: Instalar dependências e navegador real
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: Rodar suíte de testes (unittest via pytest)
        run: |
          export PYTHONPATH=.
          pytest tests/ -v

      - name: Verificar sintaxe Python
        run: python -m compileall -q backend olympus scripts

      - name: Verificar dependências Python conhecidas
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --strict

      - name: Gate de release — missão, failover, checkpoint e entrega
        run: |
          export PYTHONPATH=.
          python3 scripts/release_gate.py

      - name: Publicar relatório do gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olympus-release-gate-report
          path: .olympus/qa/release-gate.json
          if-no-files-found: ignore

      - name: Subir backend em background
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/backend"
          # Legacy endpoints are tested ONLY in this ephemeral CI environment.
          export OLYMPUS_ENABLE_LEGACY_API=1
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Esperar o backend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "backend não respondeu a tempo"
          cat backend.log
          exit 1

      - name: Healthcheck
        run: curl -f http://localhost:8000/health

      - name: Seed — primeira execução (cria dados)
        run: |
          export PYTHONPATH=.
          python3 scripts/seed_demo.py

      - name: Seed — segunda execução (deve ser idempotente, não duplicar)
        run: |
          export PYTHONPATH=.
          SAIDA=$(python3 scripts/seed_demo.py)
          echo "$SAIDA"
          echo "$SAIDA" | grep -q "Nada a fazer" || (echo "seed não foi idempotente" && exit 1)

      - name: Login (autenticação HTTP real com credenciais efêmeras)
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          payload = json.dumps({
              "email": os.environ["CI_ADMIN_EMAIL"],
              "senha": os.environ["CI_ADMIN_PASSWORD"],
          }).encode("utf-8")
          req = Request("http://127.0.0.1:8000/auth/login",
                        data=payload, headers={"Content-Type": "application/json"})
          with urlopen(req, timeout=10) as response:
              data = json.load(response)
          token = data.get("access_token")
          assert isinstance(token, str) and token
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write("TOKEN=" + token + "\n")
          print("HTTP login returned access token; token not displayed.")
          PY

      - name: Chamar endpoints protegidos com o token real
        run: |
          curl -f http://localhost:8000/dashboard/summary -H "Authorization: Bearer $TOKEN"
          echo
          curl -f "http://localhost:8000/projects?limit=10" -H "Authorization: Bearer $TOKEN"
          echo
          curl -f "http://localhost:8000/executions?limit=10" -H "Authorization: Bearer $TOKEN"
          echo
          curl -f "http://localhost:8000/logs?limit=10" -H "Authorization: Bearer $TOKEN"
          echo

      - name: Confirmar que endpoint protegido rejeita sem token (401)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/dashboard/summary)
          [ "$STATUS" = "401" ] || (echo "esperava 401, veio $STATUS" && exit 1)

      - name: Logs do backend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat backend.log || true

      - name: Encerrar backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Gerar lockfile reproduzível para migração Tailwind 4
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          echo "LOCK_TAILWIND_START"
          base64 -w0 package-lock.json
          echo
          echo "LOCK_TAILWIND_END"

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Preparar .env.local (sem credenciais)
        working-directory: frontend
        run: printf 'NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000\n' > .env.local

      - name: Build de produção
        working-directory: frontend
        run: npm run build

      - name: Auditar dependências JavaScript
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Subir em modo produção
        working-directory: frontend
        run: |
          nohup npm run start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Esperar o frontend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "frontend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "frontend não respondeu a tempo"
          cat frontend.log
          exit 1

      - name: Confirmar página de login carrega (redireciona pra /login)
        run: curl -sfL http://localhost:3000 -o /tmp/home.html && grep -qi "olympus" /tmp/home.html

      - name: Logs do frontend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat frontend.log || true

      - name: Encerrar frontend
        if: always()
        run: kill "$(cat frontend.pid)" 2>/dev/null || true
