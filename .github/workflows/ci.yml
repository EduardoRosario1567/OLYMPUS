name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt pytest

      - name: Preparar .env
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/OLYMPUS_ADMIN_SENHA=.*/OLYMPUS_ADMIN_SENHA=ci-test-password/' backend/.env

      - name: Preparar dependências e navegador para testes de interface
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar suíte de testes (unittest via pytest)
        run: |
          export PYTHONPATH=.
          pytest tests/ -v

      - name: Verificar sintaxe Python
        run: python -m compileall -q backend olympus scripts

      - name: Verificar dependências Python conhecidas
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --strict

      - name: Gate de release — missão, failover, checkpoint e entrega
        run: |
          export PYTHONPATH=.
          python3 scripts/release_gate.py

      - name: Publicar relatório do gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olympus-release-gate-report
          path: .olympus/qa/release-gate.json
          if-no-files-found: ignore

      - name: Subir backend em background
        run: |
          export PYTHONPATH=.
          cd backend
          OLYMPUS_ADMIN_EMAIL=admin@olympus.local OLYMPUS_ADMIN_SENHA=ci-test-password OLYMPUS_JWT_SECRET=ci-only-nonproduction-test-secret-0123456789 PYTHONPATH=..:. nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Esperar o backend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "backend não respondeu a tempo"
          cat backend.log
          exit 1

      - name: Healthcheck
        run: curl -f http://localhost:8000/health

      - name: Seed — primeira execução (cria dados)
        run: |
          export PYTHONPATH=.
          python3 scripts/seed_demo.py

      - name: Seed — segunda execução (deve ser idempotente, não duplicar)
        run: |
          export PYTHONPATH=.
          SAIDA=$(python3 scripts/seed_demo.py)
          echo "$SAIDA"
          echo "$SAIDA" | grep -q "Nada a fazer" || (echo "seed não foi idempotente" && exit 1)

      - name: Login (autenticação real via HTTP)
        run: |
          RESP=$(curl -sf -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@olympus.local","senha":"ci-test-password"}')
          echo "$RESP" | python3 -c "import sys,json; assert json.load(sys.stdin).get('access_token')" \
            || (echo "login não retornou access_token" && exit 1)
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verificar endpoints SaaS protegidos com token real
        run: |
          curl -fsS http://127.0.0.1:8000/cloud/saas/organizations -H "Authorization: Bearer $TOKEN" -o /tmp/ci-organizations.json
          python3 -c "import json; assert isinstance(json.load(open('/tmp/ci-organizations.json'))['organizations'], list)"
          curl -fsS http://127.0.0.1:8000/cloud/projects -H "Authorization: Bearer $TOKEN" -o /tmp/ci-projects.json
          python3 -c "import json; assert isinstance(json.load(open('/tmp/ci-projects.json'))['projects'], list)"

      - name: Confirmar que endpoint protegido rejeita sem token (401)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/cloud/saas/organizations)
          [ "$STATUS" = "401" ] || (echo "esperava 401, veio $STATUS" && exit 1)

      - name: Logs do backend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat backend.log || true

      - name: Encerrar backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Preparar .env.local
        working-directory: frontend
        run: printf "NEXT_PUBLIC_API_URL=http://127.0.0.1:8000\\n" > .env.local

      - name: Build de produção
        working-directory: frontend
        run: npm run build

      - name: Auditar dependências JavaScript
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Subir em modo produção
        working-directory: frontend
        run: |
          nohup npm run start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Esperar o frontend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "frontend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "frontend não respondeu a tempo"
          cat frontend.log
          exit 1

      - name: Confirmar página de login carrega (redireciona pra /login)
        run: curl -sfL http://localhost:3000 -o /tmp/home.html && grep -qi "olympus" /tmp/home.html

      - name: Logs do frontend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat frontend.log || true

      - name: Encerrar frontend
        if: always()
        run: kill "$(cat frontend.pid)" 2>/dev/null || true
