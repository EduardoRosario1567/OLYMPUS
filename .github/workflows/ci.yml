name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Instalar dependências do backend
        run: pip install -r requirements-core.txt -r backend/requirements.txt pytest

      - name: Preparar .env
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/OLYMPUS_ADMIN_EMAIL=.*/OLYMPUS_ADMIN_EMAIL=admin@olympus.local/' backend/.env
          sed -i 's/OLYMPUS_ADMIN_SENHA=.*/OLYMPUS_ADMIN_SENHA=ci-test-password/' backend/.env
          sed -i 's/OLYMPUS_JWT_SECRET=.*/OLYMPUS_JWT_SECRET=ci-release-gate-secret-0123456789abcdef0123456789abcdef/' backend/.env

      - name: Verificar sintaxe Python
        run: python -m compileall -q backend olympus scripts

      - name: Verificar dependências Python conhecidas
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --strict

      - name: Instalar dependências e navegador real
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Provisionar imagens de qualificação em Docker local
        if: github.event.repository.private == false
        shell: bash
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock version
          python3 scripts/verify_preview_lock.py containers/preview-runtime.package.json containers/preview-runtime.package-lock.json
          PYTHON_BASE=$(cat containers/python-base.txt)
          NODE_BASE=$(cat containers/node-base.txt)
          [[ "$PYTHON_BASE" =~ ^python@sha256:[a-f0-9]{64}$ ]]
          [[ "$NODE_BASE" =~ ^node@sha256:[a-f0-9]{64}$ ]]
          echo "Bases imutáveis: $PYTHON_BASE $NODE_BASE"
          docker --host unix:///var/run/docker.sock pull "$PYTHON_BASE"
          docker --host unix:///var/run/docker.sock pull "$NODE_BASE"
          docker --host unix:///var/run/docker.sock build --pull=false --build-arg "RUNNER_BASE=$PYTHON_BASE" -t olympus-project-runner:3.0.8-candidate -f containers/project-runner.Dockerfile containers
          docker --host unix:///var/run/docker.sock build --pull=false --build-arg "NODE_BASE=$NODE_BASE" -t olympus-preview-runner:3.0.8-candidate -f containers/preview-runner.Dockerfile containers
          docker --host unix:///var/run/docker.sock image inspect olympus-project-runner:3.0.8-candidate olympus-preview-runner:3.0.8-candidate --format '{{.Id}}'
          mkdir -p .olympus/qa/runner-provisioning
          printf '%s\n' "$PYTHON_BASE" > .olympus/qa/runner-provisioning/python-base.txt
          printf '%s\n' "$NODE_BASE" > .olympus/qa/runner-provisioning/node-base.txt
          docker --host unix:///var/run/docker.sock image inspect olympus-project-runner:3.0.8-candidate olympus-preview-runner:3.0.8-candidate > .olympus/qa/runner-provisioning/image-identities.json
          LOCK_CONTAINER=$(docker --host unix:///var/run/docker.sock create --entrypoint /bin/true olympus-preview-runner:3.0.8-candidate)
          trap 'docker --host unix:///var/run/docker.sock rm "$LOCK_CONTAINER" >/dev/null' EXIT
          docker --host unix:///var/run/docker.sock cp "$LOCK_CONTAINER:/opt/olympus-preview/package-lock.json" .olympus/qa/runner-provisioning/preview-runtime.package-lock.json
          docker --host unix:///var/run/docker.sock cp "$LOCK_CONTAINER:/opt/olympus-preview/package.json" .olympus/qa/runner-provisioning/preview-runtime.package.json
          sha256sum .olympus/qa/runner-provisioning/* > .olympus/qa/runner-provisioning/SHA256SUMS

      - name: Preservar dependências e identidades das imagens testadas
        uses: actions/upload-artifact@v6
        with:
          name: olympus-runner-provisioning
          path: .olympus/qa/runner-provisioning/
          if-no-files-found: error
          include-hidden-files: true


      - name: Gate de release — missão, failover, checkpoint e entrega
        env:
          OLYMPUS_BROWSER_CHROMIUM_SANDBOX: "0"
          # Reviewed synthetic QA subprocesses; real Docker gates do not load pytest fixtures.
          OLYMPUS_QA_TRUSTED_TESTS: "1"
        run: |
          export PYTHONPATH=.:backend
          python3 scripts/release_gate.py

      - name: Publicar relatório do gate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: olympus-release-gate-report
          path: .olympus/qa/release-gate.json
          if-no-files-found: ignore

      - name: Subir backend em background
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/backend"
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Esperar o backend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "backend não respondeu a tempo"
          cat backend.log
          exit 1

      - name: Healthcheck
        run: curl -f http://localhost:8000/health

      - name: Seed — primeira execução (cria dados)
        run: |
          export PYTHONPATH=.:backend
          python3 scripts/seed_demo.py

      - name: Seed — segunda execução (deve ser idempotente, não duplicar)
        run: |
          export PYTHONPATH=.:backend
          SAIDA=$(python3 scripts/seed_demo.py)
          echo "$SAIDA"
          echo "$SAIDA" | grep -q "Nada a fazer" || (echo "seed não foi idempotente" && exit 1)

      - name: Login (autenticação real via HTTP)
        run: |
          RESP=$(curl -sf -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@olympus.local","senha":"ci-test-password"}')
          echo "$RESP" | python3 -c "import sys,json; json.load(sys.stdin)['access_token']" \
            || (echo "login não retornou access_token" && exit 1)
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: APIs atuais autenticadas e rejeição sem token
        run: |
          python3 scripts/http_contract_gate.py

      - name: Logs do backend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat backend.log || true

      - name: Encerrar backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Preparar .env.local
        working-directory: frontend
        run: |
          printf '%s\n' 'NEXT_PUBLIC_API_BASE_URL=http://localhost:8000' > .env.local

      - name: Build de produção
        working-directory: frontend
        run: npm run build

      - name: Auditar dependências JavaScript
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Subir em modo produção
        working-directory: frontend
        run: |
          nohup npm run start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Esperar o frontend responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "frontend respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "frontend não respondeu a tempo"
          cat frontend.log
          exit 1

      - name: Confirmar página de login carrega (redireciona pra /login)
        run: curl -sfL http://localhost:3000 -o /tmp/home.html && grep -qi "olympus" /tmp/home.html

      - name: Logs do frontend (sempre, pra depurar se algo falhar)
        if: always()
        run: cat frontend.log || true

      - name: Encerrar frontend
        if: always()
        run: kill "$(cat frontend.pid)" 2>/dev/null || true

  macos-update-qualification:
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Atualização e reversão no filesystem macOS
        run: |
          python3 -m unittest tests.test_update_macos tests.test_preview_dependency_lock -v
          bash -n ATUALIZAR-OLYMPUS.command
      - name: Construir e conferir pacote exato do commit
        run: |
          python3 scripts/build_update_bundle.py --output .olympus/qa/OLYMPUS-UPDATE-CANDIDATE.zip
          python3 scripts/verify_update_bundle.py .olympus/qa/OLYMPUS-UPDATE-CANDIDATE.zip > .olympus/qa/update-package-report.json
          cat .olympus/qa/update-package-report.json
      - name: Build frontend com dependências recém-instaladas
        working-directory: frontend
        run: |
          printf '%s\n' 'NEXT_PUBLIC_API_BASE_URL=http://localhost:8000' > .env.local
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Preservar candidata e relatório de atualização
        uses: actions/upload-artifact@v6
        with:
          name: olympus-macos-update-candidate
          path: |
            .olympus/qa/OLYMPUS-UPDATE-CANDIDATE.zip
            .olympus/qa/update-package-report.json
          include-hidden-files: true
          if-no-files-found: error
