name: OLYMPUS Consolidation - Static Artifacts
on:
  push:
    branches:
      - olympus-consolidacao-unica-20261016
    paths:
      - backend/app/api/missions.py
      - tests/test_consolidation_static_mission_guard.py
      - scripts/verificar_entrega_estatica.py
      - scripts/preserve_static_delivery.py
      - scripts/rosales_real_readiness.py
      - scripts/remote_e2b_web_build.py
      - scripts/remote_e2b_unittest_runner.py
      - olympus/agent/test_runner.py
      - tests/test_e2b_consolidation_guard.py
      - tests/test_static_delivery_gate.py
      - tests/test_preserve_static_delivery.py
      - tests/test_rosales_real_readiness.py
      - tests/test_remote_e2b_web_build.py
      - missions/rosales-cafe-acceptance.md
      - .github/workflows/consolidation-static-artifacts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check static source syntax
        run: python -m py_compile scripts/verificar_entrega_estatica.py scripts/preserve_static_delivery.py scripts/rosales_real_readiness.py scripts/remote_e2b_web_build.py scripts/remote_e2b_unittest_runner.py olympus/agent/test_runner.py
      - name: Static verifier, preservation and Rosales readiness regressions
        run: |
          python -m unittest discover -s tests -p 'test_static_delivery_gate.py' -v
          python -m unittest discover -s tests -p 'test_preserve_static_delivery.py' -v
          python -m unittest discover -s tests -p 'test_rosales_real_readiness.py' -v
      - name: Remote web build boundary with fake sandbox
        run: python -m unittest discover -s tests -p 'test_remote_e2b_web_build.py' -v
      - name: Verify Docker remains default and E2B opt-in fails closed
        run: python -m unittest discover -s tests -p 'test_e2b_consolidation_guard.py' -v
  mission-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies for a real API import
        run: pip install -r requirements-core.txt -r backend/requirements.txt
      - name: Static mission must fail closed before execution
        env:
          PYTHONPATH: .:backend
        run: python -m unittest discover -s tests -p 'test_consolidation_static_mission_guard.py' -v
