services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OLYMPUS_CORS_ORIGINS: ${OLYMPUS_CORS_ORIGINS:-http://localhost:3000}
      OLYMPUS_OMNIROUTE_URL: ${OLYMPUS_OMNIROUTE_URL:-http://host.docker.internal:20128}
      OLYMPUS_JWT_SECRET: ${OLYMPUS_JWT_SECRET}
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
